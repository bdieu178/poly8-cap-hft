[package]
name = "rust_executor"
version = "0.1.0"
edition = "2021"

[dependencies]
tokio = { version = "1.32", features = ["full"] }
reqwest = { version = "=0.12.28", features = ["json"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
libc = "0.2"
dotenvy = "0.15"
hex = "0.4"
openssl = { version = "0.10", features = ["vendored"] }
alloy = { version = "=1.6.3", features = ["signers", "signer-local", "providers", "reqwest", "reqwest-rustls-tls", "rpc-types-eth", "contract"] }
polymarket_client_sdk_v2 = { path = "../../../../rs-clob-client-v2", features = ["clob", "gamma", "tracing"] }
chrono = { version = "0.4.44", features = ["serde"] }
uuid = { version = "1.8.0", features = ["serde", "v4"] }
rusqlite = { version = "0.31.0", features = ["bundled"] }
toml = "0.8"
flume = "0.11"
redis = { version = "0.24", features = ["tokio-comp", "json"] }
[[bin]]
name = "persistence_test"
path = "src/persistence_test.rs"

[[bin]]
name = "rust_executor"
path = "src/main.rs"

[[bin]]
name = "test_clob_auth"
path = "src/test_clob_auth.rs"

